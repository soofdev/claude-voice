name: Build

on:
  push:
    branches: [master, stage, replit-voice]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    name: Lint & test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Tauri pulls in webkit2gtk and friends through its build script even
      # when we only `cargo check`. Install them so the lint job can compile.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            artifact_name: claude-voice-macos
            bundle_glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          - platform: windows-latest
            args: ""
            artifact_name: claude-voice-windows
            bundle_glob: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Windows MSI/NSIS bundlers reject SemVer prerelease suffixes
      # (e.g. -alpha.1) — the version field must be numeric-only.
      # Strip it for the Windows build only; the resulting installer is
      # stamped as the underlying release version (e.g. 1.0.0). Tag-name
      # and GitHub release title still carry the full SemVer.
      - name: Strip prerelease suffix from version (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri
          jq '.version |= sub("-.*$"; "")' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
          grep '"version"' tauri.conf.json

      # Tags containing -alpha / -beta / -rc are marked prerelease so
      # they don't show up as the latest stable on the GitHub release
      # page or in any auto-update channel pointed at /releases/latest.
      - name: Detect prerelease
        id: prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == *-alpha* || "$ref" == *-beta* || "$ref" == *-rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Claude Voice ${{ github.ref_name }}"
          releaseBody: "See assets to download."
          releaseDraft: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.args }}

      - name: Build (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: warn
          retention-days: 14
