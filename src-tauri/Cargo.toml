[package]
name = "claude-voice"
version = "1.0.0-alpha.1"
description = "macOS menu-bar companion that gives AI coding agents a voice — speaks Claude Code and Replit agent responses, with a floating popup, history, and reply-back."
authors = ["Laith Zraikat <zraikat@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/soofdev/claude-voice"
homepage = "https://github.com/soofdev/claude-voice"
readme = "../README.md"

[lib]
name = "claude_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
dirs = "5"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
